<!DOCTYPE html>
<html>

<head>
    <title>Welcome Banner</title>

    <style>
        #welcomeBanner {
            background-color: blue;
            color: white;
            padding: 20px;
        }

        .highlight {
            background-color: yellow;
        }
    </style>

</head>

<body>

    <div id="welcomeBanner">
        Welcome User
    </div>

    <p class="highlight">
        Community Event Registration Open
    </p>

    <p>
        <span style="color:red; font-weight:bold;">
            Special Offer Available
        </span>
    </p>

</body>
</html>
