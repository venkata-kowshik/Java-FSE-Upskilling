<!DOCTYPE html>
<html>

<head>

    <title>Table Styling</title>

    <style>

        table {
            border-collapse: collapse;
            width: 50%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even) {
            background-color: lightgray;
        }

    </style>

</head>

<body>

    <table>

        <tr>
            <th>Name</th>
            <th>Event</th>
        </tr>

        <tr>
            <td>Arjun</td>
            <td>Music</td>
        </tr>

        <tr>
            <td>Priya</td>
            <td>Sports</td>
        </tr>

    </table>

</body>
</html>
