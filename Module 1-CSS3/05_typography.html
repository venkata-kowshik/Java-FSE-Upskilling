<!DOCTYPE html>
<html>

<head>

    <title>Typography</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
          rel="stylesheet">

    <style>

        body {
            font-family: 'Poppins', sans-serif;
        }

        h1 {
            font-size: 40px;
            font-weight: bold;
        }

        p {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 30px;
        }

    </style>

</head>

<body>

    <h1>Event Portal</h1>

    <p>
        welcome to community events
    </p>

</body>
</html>
