<!DOCTYPE html>
<html>

<head>

    <title>Links and Lists</title>

    <style>

        a:link {
            color: blue;
        }

        a:hover {
            color: red;
        }

        a:active {
            color: green;
        }

        a:visited {
            color: gray;
        }

        ul {
            list-style-type: none;
        }

        li {
            padding: 10px;
            margin: 5px;
        }

    </style>

</head>

<body>

    <ul>

        <li><a href="#">Home</a></li>
        <li><a href="#">Events</a></li>

    </ul>

</body>
</html>
