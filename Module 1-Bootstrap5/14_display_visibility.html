<!DOCTYPE html>
<html>

<head>

    <title>Display Visibility</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="container mt-4">

    <div class="d-none d-md-block bg-primary text-white p-3 mb-3">
        Visible on Tablet and Desktop
    </div>

    <div class="d-none d-lg-flex bg-success text-white p-3">
        Visible only on Large Screens
    </div>

    <div class="d-none d-md-block col-md-3 bg-dark text-white p-3 mt-3">
        Sidebar
    </div>

</body>
</html>
