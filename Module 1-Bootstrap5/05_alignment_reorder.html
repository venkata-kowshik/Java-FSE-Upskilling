<!DOCTYPE html>
<html>

<head>

    <title>Alignment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container">

        <div class="row justify-content-center align-items-center"
             style="height:200px;">

            <div class="col-4 bg-primary text-white">
                Center Box
            </div>

        </div>

        <div class="row">

            <div class="col-md-6 order-md-2 bg-warning">
                Second on Desktop
            </div>

            <div class="col-md-6 order-md-1 bg-success text-white">
                First on Desktop
            </div>

        </div>

    </div>

</body>
</html>
