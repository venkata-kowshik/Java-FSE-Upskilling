<!DOCTYPE html>
<html>

<head>

    <title>Column Layout</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container">

        <div class="row">

            <div class="col-md-3 bg-dark text-white">
                Sidebar
            </div>

            <div class="col-md-9 bg-light">
                Main Content
            </div>

        </div>

        <br>

        <div class="row">

            <div class="col-sm-3 bg-primary text-white">
                Box 1
            </div>

            <div class="col-sm-3 bg-warning">
                Box 2
            </div>

            <div class="col-sm-3 bg-success text-white">
                Box 3
            </div>

            <div class="col-sm-3 bg-danger text-white">
                Box 4
            </div>

        </div>

    </div>

</body>
</html>
